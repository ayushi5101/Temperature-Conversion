<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Conversion Program</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <h1>Temperature Conversion</h1>
        <input type="number" id="textBox" value="0"><br>

        <input type="radio" name="unit" id="toFa">
        <label for="toFa">Celsius &rarr; Fahrenheit</label><br>

        <input type="radio" name="unit" id="toCe">
        <label for="toCe">Fahrenheit &rarr; Celsius</label><br><br>

        <button type="button" onclick="convert()">Submit</button>
        <p id="result">Select a unit</p>
    </form>

    <script src="script.js"></script>
</body>
</html>
